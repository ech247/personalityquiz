<!DOCTYPE html>
<html lang="en">

<head>
	<title>Personality Quiz Starter Code</title>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- import the webpage's stylesheet -->
	<link rel="stylesheet" type="text/css" href="style.css">

	<!-- import the webpage's javascript file -->
	<script src="script.js" defer>

	</script>
</head>

<body>

	<header>
		<h1>Emma's Personality Quiz!</h1>
		<p id ="description">Answer these questions below to find out if you are more of a "morning" person or a "night" person!</p>
	</header>

	<main>

		<h2>Do you prefer sandwiches or pasta?</h2>
		<div class="question">

			<div class="answer-choice">
				<img class = "q1pic" src="assets/sandwich.jpg" alt="A picture of four small sandwiches, filled with various fillings, placed on a white rectangular plate with a fork on it.">
        <br>
        <button id="q1a1">Sandwiches</button>
      </div>

      <div class="answer-choice">
        <img class = "q1pic" src="assets/pasta.jpg" alt="A picture of a spaghetti dish with shrimp and parmesan cheese grated on top. The dish is topped with a leaf.">
        <br>
        <button id="q1a2">Pasta</button>
      </div>

    </div> 
    
    <h2>Do you prefer winter or summer?</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/winter.jpg" alt="A snowy landscape with trees covered in snow and 6 people standing in front of the trees but far away from the camera.">
        <br>
        <button id="q2a1">Winter</button>
      </div>

      <div class="answer-choice">
        <img src="assets/summer.jpg" alt="An image of the beach and the sun in the distance with a single shell laying on the sand.">
        <br>
        <button id="q2a2">Summer</button>
      </div>

    </div> 
    
    <h2>Do you prefer watching movies or reading books?</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/movies.jpg" alt=" A picture of the back shoulder of a woman holding popcorn and a remote with a TV screen in front of her.">
        <br>
        <button id="q3a1">Movies</button>
      </div>

      <div class="answer-choice">
        <img src="assets/books.jpg" alt="A picture with two books, with someone’s hands holding open one of the books. A cup of tea is placed in the center, and a few white flowers are placed on the sides.">
        <br>
        <button id="q3a2">Books</button>
      </div>

    </div> 
    
    <h2 id="result">Your result is...</h2>

    <button id="restart">Restart</button>
    
  </main>
  </body>
</html>
